name: Controllo Scadenze Quotidiano

on:
  schedule:
    - cron: '15 20 * * *' # Esegue ogni giorno alle 06:00 UTC
  workflow_dispatch: # Permette l'avvio manuale da GitHub

jobs:
  check-deadlines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Esegui script scadenze
      env:
        EMAIL_MITTENTE: ${{ secrets.EMAIL_MITTENTE }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

        run: python check_scadenze.py
